name: release

on:
  push:
    tags: ["v*"]
  # A run that signs and notarizes without publishing, so the pipeline can be
  # exercised on a branch without going public.
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Signing + notarization. Unset secrets leave the notarize step disabled.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      # The config skips signing when the secrets are absent so local snapshots
      # build; a published release must never be unsigned, so CI insists.
      - name: Require release secrets
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID TAP_DEPLOY_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; missing=1; }
          done
          exit "${missing:-0}"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN can only write this repository; the tap is a second one,
          # written over ssh with a deploy key.
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
